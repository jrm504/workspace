model:
  base_url: https://litellm.internal/v1
  default: gpt-5.6-terra
  provider: litellm
  key_env: HERMES_CUSTOM_LITELLM_API_KEY
providers:
  litellm:
    name: LiteLLM
    base_url: https://litellm.internal/v1
    model: gpt-5.6-luna
    discover_models: true
    models:
      gpt-5.6-luna: {}
    ssl_ca_cert: ${HOME}/certs/internal-rootca.crt
    key_env: HERMES_CUSTOM_LITELLM_API_KEY
agent:
  reasoning_effort: high
terminal:
  backend: docker
  cwd: /work
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes:
    - ${HOME}/work:/work
    - ${HOME}/work:${HOME}/work
  docker_mount_cwd_to_workspace: true
  persistent_shell: true
  lifetime_seconds: 300
auxiliary:
  stream_only_base_urls:
    - litellm.internal
  vision:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: none
  compression:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
  skills_hub:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
  approval:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: none
  review:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
  mcp:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
  title_generation:
    provider: litellm
    model: gpt-5.6-luna
  curator:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
plugins:
  enabled: []
  disabled: []
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: hindsight
  flush_min_turns: 6
  mnemosyne:
    auto_sleep: 'True'
    default_scope: global
    reflect: '{''disabled_for_cron'': True, ''max_calls_per_session'': 3}'
    shared_surface_path: ${HOME}/.hermes/mnemosyne/data/mnemosyne.db
    skip_contexts: cron,flush,subagent,background,skill_loop
    sleep_threshold: '50'
    sync_roles: '[''user'']'
    vector_type: int8
streaming:
  enabled: false
_config_version: 40
platform_toolsets:
  cli:
    - file
    - terminal
    - web
    - skills
    - session_search
    - clarify
    - todo
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
