name: contract
version: 0.1.0
description: API Contract Engineer. Verifies OpenAPI, AsyncAPI, HTTP and WebSocket
  contracts, authentication requirements, schemas, provider behavior, compatibility,
  and contract-test expectations. Uses Hoalulab MCP documentation as a primary reference
  and reports contract mismatches without modifying production SDK code.
hermes_requires: ">=0.12.0"
author: "Hoalulab"
license: "MIT"

env_requires:
  - name: HERMES_CUSTOM_LITELLM_API_KEY
    description: "LiteLLM API key (for model access)"
    required: true
