model:
  base_url: https://litellm.internal/v1
  default: coding
  provider: litellm
  key_env: HERMES_CUSTOM_LITELLM_API_KEY
auxiliary:
  stream_only_base_urls:
    - litellm.internal
  vision:
    provider: litellm
    model: coding
    reasoning_effort: none
  compression:
    provider: litellm
    model: coding
    reasoning_effort: low
  skills_hub:
    provider: litellm
    model: coding
    reasoning_effort: low
  approval:
    provider: litellm
    model: coding
    reasoning_effort: none
  review:
    provider: litellm
    model: coding
    reasoning_effort: low
  mcp:
    provider: litellm
    model: coding
    reasoning_effort: low
  title_generation:
    provider: litellm
    model: coding
  curator:
    provider: litellm
    model: coding
    reasoning_effort: low
platform_toolsets:
  cli:
    - file
    - terminal
    - web
    - skills
    - session_search
    - clarify

providers:
  litellm:
    name: LiteLLM
    base_url: https://litellm.internal/v1
    model: coding
    discover_models: true
    models:
      coding: {}
    # ssl_ca_cert: ${HOME}/certs/internal-rootca.crt
    key_env: HERMES_CUSTOM_LITELLM_API_KEY
plugins:
  enabled: []
  disabled: []
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: hindsight
  flush_min_turns: 6

_config_version: 40
agent: {}
streaming:
  enabled: false
terminal:
  backend: docker
  cwd: /opt/workspace
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes:
    - mise_data:/mise
    - /opt/hermes-work:/opt/hermes-work
    - ${HOME}/work:${HOME}/work
  docker_mount_cwd_to_workspace: true
  persistent_shell: true
  lifetime_seconds: 300
mcp_servers:
  hoalu-docs:
    enabled: true
    url: https://hoalu.mintlify.app/mcp
