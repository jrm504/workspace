model:
  base_url: https://litellm.internal/v1
  default: gpt-5.6-terra
  provider: litellm
  key_env: HERMES_CUSTOM_LITELLM_API_KEY
auxiliary:
  stream_only_base_urls:
    - litellm.internal
  vision:
    provider: litellm
    model: coding
    reasoning_effort: none
  compression:
    provider: litellm
    model: coding
    reasoning_effort: low
  skills_hub:
    provider: litellm
    model: coding
    reasoning_effort: low
  approval:
    provider: litellm
    model: coding
    reasoning_effort: none
  review:
    provider: litellm
    model: coding
    reasoning_effort: low
  mcp:
    provider: litellm
    model: coding
    reasoning_effort: low
  title_generation:
    provider: litellm
    model: coding
  curator:
    provider: litellm
    model: coding
    reasoning_effort: low
providers:
  litellm:
    name: LiteLLM
    base_url: https://litellm.internal/v1
    model: coding
    discover_models: true
    models:
      coding: {}
    # ssl_ca_cert: ${HOME}/certs/internal-rootca.crt
    key_env: HERMES_CUSTOM_LITELLM_API_KEY
toolsets:
  - kanban

platform_toolsets:
  cli:
    - skills
    - session_search
    - clarify
    - todo
    - kanban
    - delegation

plugins:
  enabled: []
  disabled: []
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: hindsight
  flush_min_turns: 6

_config_version: 40
agent:
  max_turns: 60
  bot_mode_protocol: true
  verify_on_stop: false
streaming:
  enabled: false
terminal:
  backend: docker
  cwd: /opt/workspace
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes:
    - mise_data:/mise
    - /opt/hermes-work:/opt/hermes-work
  docker_mount_cwd_to_workspace: true
  persistent_shell: true
  lifetime_seconds: 300

kanban:
  auto_subscribe_on_create: true
  dispatch_in_gateway: true
  review_dispatch: true
  dispatch_interval_seconds: 30
  orchestrator_profile: orchestrator
  default_assignee: orchestrator
  max_in_progress: 4
  max_in_progress_per_profile: 1
  auto_decompose: false
moa:
  enabled: false
