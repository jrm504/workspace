services:
  jupyter:
    build:
      context: .
      args:
        UID: 1000
        GID: 1000
    restart: "no"
    user: "1000:1000"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - ${WORKSPACE_DIR:?required}:${WORKSPACE_DIR}
    working_dir: ${WORKSPACE_DIR}
    labels:
      traefik.enable: "true"
      traefik.docker.network: homelab_frontend
      traefik.http.routers.jupyter.rule: "Host(`${JUPYTER_DOMAIN:-jupyter.internal}`)"
      traefik.http.routers.jupyter.entrypoints: websecure
      traefik.http.routers.jupyter.tls: "true"
      traefik.http.routers.jupyter.tls.certresolver: stepca
      traefik.http.services.jupyter.loadbalancer.server.port: "8888"
    networks:
      - homelab_frontend

networks:
  homelab_frontend:
    external: true