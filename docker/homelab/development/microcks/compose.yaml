services:
  microcks:
    image: quay.io/microcks/microcks-uber:latest-native@sha256:c0daa6b10aefccb68341828dc98d9fd540f8fd5aa4485ed41c2f428582593d91
    container_name: microcks-uber
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: homelab_frontend
      traefik.http.routers.microcks.rule: "Host(`${MICROCKS_DOMAIN:-microcks.internal}`)"
      traefik.http.routers.microcks.entrypoints: websecure
      traefik.http.routers.microcks.tls: "true"
      traefik.http.routers.microcks.tls.certresolver: stepca
      traefik.http.services.microcks.loadbalancer.server.port: "8080"
    networks:
      - homelab_frontend

networks:
  homelab_frontend:
    external: true