name: reviewer
version: 0.1.0
description: Senior Software Reviewer. Independently reviews implementation quality,
  architecture compliance, maintainability, concurrency safety, error handling, security
  risks, API compatibility, and test quality. Focuses on whether the implementation
  is safe and suitable to merge. Does not implement production code.
hermes_requires: ">=0.12.0"
author: "Hoalulab"
license: "MIT"

env_requires:
  - name: HERMES_CUSTOM_LITELLM_API_KEY
    description: "LiteLLM API key (for model access)"
    required: true
