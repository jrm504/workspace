services:
  litellm:
    image: docker.litellm.ai/berriai/litellm-non_root:v1.106.6@sha256:6363e53f135dafbf4a68fac25f77aec3f2b99be37665e8c5f623a952637c220b
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY is required}
      DATABASE_URL: postgresql://litellm:${LITELLM_POSTGRES_PASSWORD:?LITELLM_POSTGRES_PASSWORD is required}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:?LITELLM_REDIS_PASSWORD is required}
      CHATGPT_TOKEN_DIR: /data/chatgpt
      CHATGPT_AUTH_FILE: auth.json
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      LITELLM_LOG: ${LITELLM_LOG:-ERROR}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "--config",  "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - litellm_chatgpt_auth:/data/chatgpt
    networks:
      - frontend
      - backend
    labels:
      traefik.enable: "true"
      traefik.docker.network: litellm_frontend
      traefik.http.routers.litellm.rule: "Host(`${LITELLM_DOMAIN:-litellm.internal}`)"
      traefik.http.routers.litellm.entrypoints: websecure
      traefik.http.routers.litellm.tls: "true"
      traefik.http.routers.litellm.tls.certresolver: stepca
      traefik.http.services.litellm.loadbalancer.server.port: "4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:4000/health/readiness',
          timeout=5)
      interval: 10s
      timeout: 6s
      start_period: 120s
      retries: 6

  db:
    image: postgres:16.15@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      LITELLM_POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?LITELLM_POSTGRES_PASSWORD is required}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:8.8.3-alpine@sha256:f61bc3826f4a37a6ba8ca50ee75e3525709b01779d8e468233e6d238119aed72
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:?LITELLM_REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${LITELLM_REDIS_PASSWORD:?LITELLM_REDIS_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG'
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - backend

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.364@sha256:ae8f6f111ac2f04e3fec552f7f80edd0dcbfa2dd69ee1b9e030475be31669885
    restart: unless-stopped
    networks:
      - backend

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.364@sha256:e567013893ebc80994e3799f6f55c86aa1f0b0fadb779571ab346f0ec45365c1
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  traefik_acme:
  litellm_chatgpt_auth:

networks:
  backend:
    internal: true