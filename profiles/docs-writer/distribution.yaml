name: docs-writer
version: 0.1.0
description: Technical Documentation Writer. Produces and maintains accurate developer
  documentation, API guides, examples, changelogs, migration notes, and architecture
  documentation based on verified product, contract, and implementation behavior.
  Does not invent undocumented behavior or modify production code by default.
hermes_requires: ">=0.12.0"
author: "VNBrokers"
license: "MIT"

env_requires:
  - name: HERMES_CUSTOM_LITELLM_API_KEY
    description: "LiteLLM API key (for model access)"
    required: true
