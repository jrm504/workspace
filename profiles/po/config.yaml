model:
  base_url: https://litellm.internal/v1
  default: gpt-5.6-luna
  provider: litellm
  key_env: HERMES_CUSTOM_LITELLM_API_KEY
auxiliary:
  stream_only_base_urls:
    - litellm.internal
  vision:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: none
  compression:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
  skills_hub:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
  approval:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: none
  review:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
  mcp:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
  title_generation:
    provider: litellm
    model: gpt-5.6-luna
  curator:
    provider: litellm
    model: gpt-5.6-luna
    reasoning_effort: low
platform_toolsets:
  cli:
    - session_search
    - clarify
providers:
  litellm:
    name: LiteLLM
    base_url: https://litellm.internal/v1
    model: gpt-5.6-luna
    discover_models: true
    models:
      gpt-5.6-luna: {}
    ssl_ca_cert: ${HOME}/certs/internal-rootca.crt
    key_env: HERMES_CUSTOM_LITELLM_API_KEY
plugins:
  enabled: []
  disabled: []
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: hindsight
  flush_min_turns: 6
  mnemosyne:
    auto_sleep: 'True'
    default_scope: global
    reflect: '{''disabled_for_cron'': True, ''max_calls_per_session'': 3}'
    shared_surface_path: ${HOME}/.hermes/mnemosyne/data/mnemosyne.db
    skip_contexts: cron,flush,subagent,background,skill_loop
    sleep_threshold: '50'
    sync_roles: '[''user'']'
    vector_type: int8
_config_version: 40
agent: {}
streaming:
  enabled: false
terminal:
  backend: docker
  cwd: /work
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes:
    - ${HOME}/work:/work
    - ${HOME}/work:${HOME}/work
  docker_mount_cwd_to_workspace: true
  persistent_shell: true
  lifetime_seconds: 300
