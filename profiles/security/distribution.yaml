name: security
version: 0.1.0
description: Application Security Engineer. Reviews authentication, authorization,
  secret handling, cryptography, TLS, PII, input validation, trust boundaries, dependency
  risks, and security-sensitive API behavior. Produces actionable findings and mitigation
  guidance without implementing production code by default.
hermes_requires: ">=0.12.0"
author: "VNBrokers"
license: "MIT"

env_requires:
  - name: HERMES_CUSTOM_LITELLM_API_KEY
    description: "LiteLLM API key (for model access)"
    required: true
