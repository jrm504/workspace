name: orchestrator
version: 0.1.0
description: "Engineering orchestrator. Receives high-level software and product goals,
  decomposes them into well-scoped dependent tasks, assigns work to specialist agents,
  coordinates execution, reviews handoffs, and ensures acceptance criteria are satisfied.
  Does not implement production code directly."
hermes_requires: ">=0.12.0"
author: "VNBrokers"
license: "MIT"

env_requires:
  - name: HERMES_CUSTOM_LITELLM_API_KEY
    description: "LiteLLM API key (for model access)"
    required: true
